    <!-- Theme Script: Prevent Flash of Incorrect Theme -->
    <script>
      (function() {
        const savedTheme = localStorage.getItem('theme');
        const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (savedTheme === 'dark' || (!savedTheme && systemDark)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>

    <!-- Google Fonts, via Google's own China-accessible mirror (.cn). The
         audience for this app is largely in mainland China, where
         fonts.googleapis.com does not resolve — the original .com host meant
         these never loaded for most users. If the mirror is unreachable the
         font stacks in tailwind.config.js fall back to installed system faces
         (PingFang SC / Microsoft YaHei), not to a generic sans. -->
    <link rel="preconnect" href="https://fonts.googleapis.cn">
    <link rel="preconnect" href="https://fonts.gstatic.cn" crossorigin>
    <link href="https://fonts.googleapis.cn/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
</head>
