name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # jsdom 30 (via undici 8) declares
          # ^22.22.2 || ^24.15.0 || >=26.0.0 and crashes on Node 20 with
          # "webidl.util.markAsUncloneable is not a function".
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Runs typecheck a second time via the build script; cheap, and it means a
      # green CI is a guarantee the deploy will actually produce artifacts.
      - name: Build
        run: npm run build
